# Full local development stack.
# Usage:
#   docker compose up -d          # start postgres + redis
#   cd apps/api && pnpm start:dev  # run API with hot reload
#   cd apps/web && pnpm dev        # run Next.js dev server

version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: routeshare
      POSTGRES_PASSWORD: routeshare
      POSTGRES_DB: routeshare
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U routeshare']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://routeshare:routeshare@postgres:5432/routeshare
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-min-32-chars-long!!
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-chars-long!!
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 1209600
      CORS_ORIGINS: http://localhost:3001
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 120
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:3000
    ports:
      - '3001:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
